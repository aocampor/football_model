[project]
name = "monkey-football-analysis"
version = "0.1.0"
description = "Analysis of football data"
requires-python = "~=3.11"
dependencies = [
    "pandas",
    "jupyterlab",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "numpy",
    "lightgbm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
